name: Update IPO Snapshot

on:
  workflow_dispatch:
  schedule:
    # 09:05 Asia/Shanghai = 01:05 UTC
    - cron: "5 1 * * *"

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh IPO snapshot
        run: python3 scripts/fetch_iqdii_ipo_snapshot.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipo-live.js
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "Update IPO snapshot"
          git push
